<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="topbar">
  <a class="brand" routerLink="/productos">JM Boutique</a>

  <nav class="nav" aria-label="Principal">
    <a routerLink="/productos" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
           stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M6 8h12l1 12H5L6 8z" />
        <path d="M9 8V6a3 3 0 0 1 6 0v2" />
      </svg>
      <span>Productos</span>
    </a>

    <a routerLink="/movimientos" routerLinkActive="is-active"
       [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
      <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
           stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M7 7h11l-3-3" />
        <path d="M17 17H6l3 3" />
      </svg>
      <span>Movimientos</span>
    </a>

    <a class="nav-action" routerLink="/movimientos/nuevo" routerLinkActive="is-active"
       ariaCurrentWhenActive="page">
      <span class="nav-icon">
        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </span>
      <span>Registrar</span>
    </a>
  </nav>
</header>

<main id="contenido" class="page" tabindex="-1">
  <router-outlet />
</main>

<div class="toast-region" role="status">
  @if (notifier.message(); as text) {
    <p class="toast">
      <span>{{ text }}</span>
      <button type="button" class="toast-close" aria-label="Cerrar mensaje" (click)="notifier.dismiss()">×</button>
    </p>
  }
</div>
